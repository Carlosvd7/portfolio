description:
  es: Agente de IA con un **servidor MCP propio** que responde preguntas sobre paro, población, inflación y precios de carburantes con datos oficiales del INE y del Ministerio, enseñando la consulta SQL y la fuente. Pipeline reproducible a DuckDB, SQL de solo lectura con varias capas de seguridad y evaluación con 40 preguntas, con un **100 % de respuestas correctas** y un 88 % de precisión por ejecución, a unos 0,001 $ por pregunta.
  en: An AI agent with its **own MCP server** that answers questions about Spanish unemployment, population, inflation and fuel prices using official open data, showing the SQL and the source. Reproducible DuckDB pipeline, read-only SQL with defence in depth, and a 40-question evaluation with **100% correct answers** and 88% execution accuracy, at about $0.001 per question.
