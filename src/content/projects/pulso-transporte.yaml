title:
  es: Pulso del transporte
  en: Transport Pulse
label:
  es: Ingeniería de datos · Streaming en tiempo real
  en: Data engineering · Real-time streaming
description:
  es: Tubería de datos en tiempo real sobre el GTFS-Realtime abierto de Renfe (Cercanías y AV/LD) con ingesta continua cada 30 s, bus de eventos Redpanda (Kafka), contratos de calidad con cola de rechazados, procesamiento en streaming con ventanas por tiempo de evento y detección de anomalías (picos de retraso, cancelaciones, trenes detenidos), y un panel web en vivo con mapa. Detecta y corrige problemas reales del feed, como **1.193 retrasos con un desfase de ±24 h** en una sola noche, y sigue en directo **unos 700 trenes a la vez** en hora punta.
  en: Real-time data pipeline on Renfe's open GTFS-Realtime feeds (commuter and long-distance rail) with 30-second ingestion, a Redpanda (Kafka) event bus, data-quality contracts with a dead-letter queue, event-time windowed stream processing with anomaly detection (delay spikes, cancellations, stalled trains) and a live web dashboard with a map. It catches and fixes real feed defects, such as **1,193 delays off by ±24 h** in a single night, and tracks **around 700 trains at once** at peak time.
status: in-progress
