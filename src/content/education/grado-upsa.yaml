  en:
    - Major in **Software Engineering**.
    - "**Final-year project · Real-time Spanish Sign Language recognition:** a self-recorded, hand-labelled dataset, hand keypoints with MediaPipe and three TensorFlow/Keras models: a dense network for letters (81%), a bidirectional LSTM for words (**93% accuracy**) and an LSTM for two-handed phrases (91%). Flask API and Angular web app, focused on accessibility and inclusive education."
    - Coursework projects with Java and Quarkus (microservices), Django, Angular with Node.js and MongoDB, and interface design in Human-Computer Interaction.
