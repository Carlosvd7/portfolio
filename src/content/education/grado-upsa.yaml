bullets:
  es:
    - Mención en **Ingeniería del Software**.
    - '**TFG · Reconocimiento de lengua de signos española en tiempo real:** dataset propio grabado y etiquetado a mano, puntos clave de las manos con MediaPipe y tres modelos en TensorFlow/Keras: red densa para letras (81 %), LSTM bidireccional para palabras (**93 % de precisión**) y LSTM para frases con dos manos (91 %). API en Flask y web en Angular, con un enfoque de accesibilidad e inclusión educativa.'
